<!DOCTYPE html>
<html>
<head>
    <title>Test Companies API</title>
</head>
<body>
    <h1>Test Companies API</h1>
    <button onclick="testAPI()">Test API Call</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            try {
                const response = await fetch('https://menusmitra.xyz/v2.3/admin/list_companies', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // You'll need to add a valid token here for testing
                        'Authorization': 'Bearer YOUR_TOKEN_HERE'
                    },
                    body: JSON.stringify({
                        user_id: 440
                    })
                });
                
                const data = await response.json();
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
