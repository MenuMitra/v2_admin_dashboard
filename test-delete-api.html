<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Delete Company API</title>
</head>
<body>
    <h1>Test Delete Company API</h1>
    <button onclick="testDeleteAPI()">Test Delete API</button>
    <div id="result"></div>

    <script>
        async function testDeleteAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';

            try {
                const response = await fetch('https://menusmitra.xyz/v2.3/admin/delete_company', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // You'll need to add the actual authorization token here
                        // 'Authorization': 'your-token-here'
                    },
                    body: JSON.stringify({
                        "user_id": 440,
                        "app_source": "admin",
                        "company_id": 1  // Test with a company ID that exists
                    })
                });

                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <h3>Response:</h3>
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>Data:</strong></p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                
                console.log('API Response:', data);
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3>Error:</h3>
                    <p>${error.message}</p>
                `;
                console.error('API Error:', error);
            }
        }
    </script>
</body>
</html>
