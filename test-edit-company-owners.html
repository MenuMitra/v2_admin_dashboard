<!DOCTYPE html>
<html>
<head>
    <title>Test Edit Company Owners Integration</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Test Edit Company Owners Integration</h1>
    
    <div class="test-section">
        <h2>1. Test View Company API</h2>
        <button onclick="testViewCompanyAPI()">Test View Company API</button>
        <div id="view-company-result"></div>
    </div>

    <div class="test-section">
        <h2>2. Test Owners API</h2>
        <button onclick="testOwnersAPI()">Test List Owners API</button>
        <div id="owners-result"></div>
    </div>

    <div class="test-section">
        <h2>3. Test Super Owners API</h2>
        <button onclick="testSuperOwnersAPI()">Test List Super Owners API</button>
        <div id="super-owners-result"></div>
    </div>

    <div class="test-section">
        <h2>4. Test Update Company Payload</h2>
        <button onclick="testUpdateCompanyPayload()">Test Update Company with Owners</button>
        <div id="update-company-result"></div>
    </div>

    <script>
        async function testViewCompanyAPI() {
            const resultDiv = document.getElementById('view-company-result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('https://menusmitra.xyz/v2.2/admin/view_company', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // Note: Replace with actual token for testing
                        'Authorization': 'Bearer YOUR_TOKEN_HERE'
                    },
                    body: JSON.stringify({
                        company_id: 123, // Replace with actual company ID
                        user_id: 440
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">✓ View Company API Success</div>
                        <p>Company data loaded successfully</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">✗ View Company API Failed</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">✗ Error: ${error.message}</div>
                `;
            }
        }

        async function testOwnersAPI() {
            const resultDiv = document.getElementById('owners-result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('https://menusmitra.xyz/v2.2/common/listview_owner/440', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        // Note: Replace with actual token for testing
                        'Authorization': 'Bearer YOUR_TOKEN_HERE'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">✓ Owners API Success</div>
                        <p>Found ${Array.isArray(data) ? data.length : 0} owners</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">✗ Owners API Failed</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">✗ Error: ${error.message}</div>
                `;
            }
        }

        async function testSuperOwnersAPI() {
            const resultDiv = document.getElementById('super-owners-result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('https://menusmitra.xyz/v2.2/admin/listview_super_owner', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // Note: Replace with actual token for testing
                        'Authorization': 'Bearer YOUR_TOKEN_HERE'
                    },
                    body: JSON.stringify({
                        user_id: 440,
                        app_source: 'admin_app'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    const superOwners = data.super_owners || [];
                    resultDiv.innerHTML = `
                        <div class="success">✓ Super Owners API Success</div>
                        <p>Found ${superOwners.length} super owners</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">✗ Super Owners API Failed</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">✗ Error: ${error.message}</div>
                `;
            }
        }

        function testUpdateCompanyPayload() {
            const resultDiv = document.getElementById('update-company-result');
            
            // Simulate the payload that would be sent to update company API
            const samplePayload = {
                app_source: "admin_panel",
                company_id: 123,
                user_id: 440,
                company_name: "Updated Test Company",
                company_type: "private_limited",
                pan: "ABCDE1234F",
                fssai: "12345678901234",
                tan: "ABCD123456",
                cin: "U12345AB1234PTC123456",
                contact_details: [
                    {
                        email: "updated@company.com",
                        contact_number: "9876543210",
                        type: "head_office",
                        address_line1: "Updated Address",
                        address_line2: null,
                        city: "Updated City",
                        state: "MH",
                        pin: "123456",
                        landmark: "Updated Landmark"
                    }
                ],
                owners: [
                    {
                        name: "Updated Owner",
                        mobile: "9876543210",
                        aadhar: "123456789012",
                        pan: "ABCDE1234F",
                        email: "updated.owner@test.com",
                        address: "Updated Owner Address"
                    }
                ],
                selected_owners: [123, 456], // These are the new fields we added
                selected_super_owners: [789, 101] // These are the new fields we added
            };

            resultDiv.innerHTML = `
                <div class="success">✓ Update Company Payload Structure</div>
                <p>The payload now includes selected owners and super owners:</p>
                <pre>${JSON.stringify(samplePayload, null, 2)}</pre>
                <p><strong>Key Changes:</strong></p>
                <ul>
                    <li>Added <code>selected_owners</code> array to the payload</li>
                    <li>Added <code>selected_super_owners</code> array to the payload</li>
                    <li>Owners are fetched using <code>/common/listview_owner/{user_id}</code> API</li>
                    <li>Super owners are fetched using <code>/admin/listview_super_owner</code> API</li>
                    <li>Existing company data is loaded from <code>/admin/view_company</code> API</li>
                    <li>Both dropdowns support multi-selection with search functionality</li>
                    <li>Selected owners/super owners are preserved when editing</li>
                </ul>
            `;
        }
    </script>
</body>
</html>
