<!DOCTYPE html>
<html>
<head>
    <title>Test Create Outlet Companies Integration</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Test Create Outlet Companies Integration</h1>
    
    <div class="test-section">
        <h2>1. Test Companies API</h2>
        <button onclick="testCompaniesAPI()">Test List Companies API</button>
        <div id="companies-result"></div>
    </div>

    <div class="test-section">
        <h2>2. Test Create Outlet Payload</h2>
        <button onclick="testCreateOutletPayload()">Test Create Outlet with Company ID</button>
        <div id="create-outlet-result"></div>
    </div>

    <script>
        async function testCompaniesAPI() {
            const resultDiv = document.getElementById('companies-result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('https://menusmitra.xyz/v2.3/admin/list_companies', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // Note: Replace with actual token for testing
                        'Authorization': 'Bearer YOUR_TOKEN_HERE'
                    },
                    body: JSON.stringify({
                        user_id: 440
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">✓ Companies API Success</div>
                        <p>Found ${data.companies ? data.companies.length : 0} companies</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">✗ Companies API Failed</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">✗ Error: ${error.message}</div>
                `;
            }
        }

        function testCreateOutletPayload() {
            const resultDiv = document.getElementById('create-outlet-result');
            
            // Simulate the payload that would be sent to create outlet API
            const samplePayload = {
                user_id: 123,
                name: "Test Outlet",
                mobile: "9876543210",
                address: "Test Address",
                outlet_type: "restaurant",
                outlet_mode: "online",
                veg_nonveg: "veg",
                upi_id: "test@paytm",
                has_combo: 0,
                has_denomination: 0,
                reserve_table: 0,
                company_id: 456, // This is the new field we added
                module_ids: [1, 2, 3],
                subscription: {
                    name: "Test Plan",
                    price: 1000,
                    tenure_months: 12
                }
            };

            resultDiv.innerHTML = `
                <div class="success">✓ Create Outlet Payload Structure</div>
                <p>The payload now includes company_id field:</p>
                <pre>${JSON.stringify(samplePayload, null, 2)}</pre>
                <p><strong>Key Changes:</strong></p>
                <ul>
                    <li>Added <code>company_id</code> field to the payload</li>
                    <li>Company ID will be selected from the companies dropdown</li>
                    <li>Companies are fetched using <code>/admin/list_companies</code> API</li>
                    <li>User ID 440 is used as per requirements</li>
                </ul>
            `;
        }
    </script>
</body>
</html>
