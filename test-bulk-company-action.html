<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Bulk Company Action API</title>
</head>
<body>
    <h1>Test Bulk Company Action API</h1>
    
    <div>
        <h3>Test Actions (with correct payload structure):</h3>
        <button onclick="testBulkAction('active')">Test Active</button>
        <button onclick="testBulkAction('inactive')">Test Inactive</button>
        <button onclick="testBulkAction('delete')">Test Delete</button>
    </div>
    
    <div id="result"></div>

    <script>
        async function testBulkAction(action) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `Testing ${action} action...`;

            try {
                const response = await fetch('https://menusmitra.xyz/v2.2/common/bulk_company_action', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // You'll need to add the actual authorization token here
                        // 'Authorization': 'your-token-here'
                    },
                    body: JSON.stringify({
                        "user_id": 440,
                        "action": action,
                        "app_source": "admin",
                        "company_ids": [1, 2] // Test with company IDs that exist
                    })
                });

                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <h3>Response for ${action}:</h3>
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>Payload sent:</strong></p>
                    <pre>{
  "user_id": 440,
  "action": "${action}",
  "app_source": "admin",
  "company_ids": [1, 2]
}</pre>
                    <p><strong>Response Data:</strong></p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                
                console.log(`${action} API Response:`, data);
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3>Error for ${action}:</h3>
                    <p>${error.message}</p>
                `;
                console.error(`${action} API Error:`, error);
            }
        }
    </script>
</body>
</html>
